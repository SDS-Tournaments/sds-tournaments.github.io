# Публикация сайта на GitHub Pages при каждом пуше в main
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      # SPA: прямые ссылки (/pilots/…, /admin) — GitHub Pages отдаёт 404.html, а это то же приложение
      - run: cp dist/sds/browser/index.html dist/sds/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sds/browser
      - id: deployment
        uses: actions/deploy-pages@v4

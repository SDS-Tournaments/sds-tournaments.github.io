<header class="header">
  <div class="container bar">
    <a routerLink="/" class="logo" (click)="menuOpen.set(false)">
      <span class="logo-mark">SDS</span>
      <span class="logo-text">Sad Drift Series</span>
    </a>

    <nav class="nav" [class.open]="menuOpen()" [attr.aria-label]="'nav.menu' | transloco">
      @for (item of nav; track item) {
        <a [routerLink]="'/' + item" routerLinkActive="active" (click)="menuOpen.set(false)">{{ 'nav.' + item | transloco }}</a>
      }
    </nav>

    <div class="actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" [class.on]="lang() === 'ru'" [attr.aria-pressed]="lang() === 'ru'" (click)="setLang('ru')">RU</button>
        <button type="button" [class.on]="lang() === 'en'" [attr.aria-pressed]="lang() === 'en'" (click)="setLang('en')">EN</button>
      </div>
      <button type="button" class="btn btn-primary login">
        <span class="long">{{ 'auth.login' | transloco }}</span><span class="short">{{ 'auth.loginShort' | transloco }}</span>
      </button>
      <button type="button" class="burger" [attr.aria-expanded]="menuOpen()" [attr.aria-label]="'nav.menu' | transloco" (click)="menuOpen.set(!menuOpen())">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="container foot">
    <span class="logo-mark">SDS</span>
    <span class="subtle">© {{ year }} Sad Drift Series · CarX Drift Racing Online 2</span>
    <a routerLink="/archive">{{ 'nav.archive' | transloco }}</a>
  </div>
</footer>

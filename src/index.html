<body>
  <!-- Загрузочный экран: «SAD» заливается по мере загрузки (логика — src/app/boot.ts) -->
  <style>
    @property --p { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    @property --b0 { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    #boot {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 22px;
      background: var(--canvas, #000); transition: opacity 600ms ease, visibility 600ms;
      animation: boot0 2.4s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .w {
      /* элегантно: Inter, широкая разрядка; незалитая часть — та же буква, едва видная (контур у Inter даёт внутренние линии) */
      font: 500 clamp(56px, 13vw, 116px) / 1 Inter, system-ui, sans-serif; letter-spacing: 0.42em; padding-left: 0.42em;
      color: transparent;
      background: linear-gradient(to top, var(--primary, #0abab5) max(var(--b0), var(--p)), rgba(var(--accent-rgb, 10, 186, 181), 0.14) max(var(--b0), var(--p))) no-repeat;
      -webkit-background-clip: text; background-clip: text;
      filter: drop-shadow(0 0 14px rgba(10, 186, 181, 0.18));
      transition: --p 700ms cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    #boot .s { margin: 0; font: 400 11px/1 Inter, system-ui, sans-serif; letter-spacing: 0.6em; padding-left: 0.6em; text-transform: uppercase; color: var(--ink-subtle, #6f6f6f); }
    @keyframes boot0 { to { --b0: 30%; } }
  </style>
  <div id="boot" aria-hidden="true"><span class="w">SAD</span><p class="s">Sad Drift Series</p></div>
  <script>if (location.pathname.indexOf('/overlay') === 0) document.getElementById('boot').remove();</script>
  <app-root></app-root>
</body>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Sad Drift Series</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <script>
    // выбранная тема — сразу, до отрисовки (без вспышки тёмной)
    try {
      var t = localStorage.getItem('sds-theme');
      if (t === 'light') t = 'legend';
      var bar = { noir: '#000000', bronze: '#000000', silver: '#000000', gold: '#000000', elite: '#07040d', legend: '#f1eee7' }[t];
      if (bar) { document.documentElement.dataset.theme = t; document.querySelector('meta[name=theme-color]').content = bar; }
    } catch (e) {}
  </script>
  <meta name="description" content="Sad Drift Series — онлайн-чемпионат по дрифту в CarX Drift Racing Online 2">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
